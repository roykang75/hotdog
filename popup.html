<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1 class="title">🌭 Hotdog</h1>
    <p class="subtitle">페이지 번역기</p>

    <!-- View 1: 메인 (번역) -->
    <div id="viewMain" class="view active">
      <div class="field">
        <label for="engine">번역 엔진</label>
        <select id="engine"></select>
      </div>

      <div class="field">
        <label for="targetLang">번역 언어</label>
        <select id="targetLang">
          <option value="ko">한국어</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="zh-CN">中文 (简体)</option>
          <option value="zh-TW">中文 (繁體)</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="pt">Português</option>
          <option value="vi">Tiếng Việt</option>
          <option value="th">ไทย</option>
          <option value="ru">Русский</option>
        </select>
      </div>

      <div class="btn-row">
        <button id="translateBtn" class="btn-translate">번역</button>
        <button id="summarizeBtn" class="btn-summarize" disabled>요약</button>
      </div>
      <button id="removeBtn" class="btn-remove">번역 제거</button>
      <button id="manageBtn" class="btn-manage">⚙ AI 서버 관리</button>
      <button id="clearCacheBtn" class="btn-manage">🗑 번역 캐시 삭제</button>

      <p id="status" class="status"></p>
    </div>

    <!-- View 2: 서버 목록 -->
    <div id="viewServers" class="view">
      <div class="view-header">
        <button class="btn-back" data-target="viewMain">←</button>
        <span>AI 서버 관리</span>
      </div>
      <div id="serverList"></div>
      <button id="addServerBtn" class="btn-add-server">+ 서버 추가</button>
    </div>

    <!-- View 3: 서버 추가/편집 폼 -->
    <div id="viewServerForm" class="view">
      <div class="view-header">
        <button class="btn-back" data-target="viewServers">←</button>
        <span id="formTitle">서버 추가</span>
      </div>
      <p class="preset-label">빠른 설정</p>
      <div class="preset-buttons">
        <button id="presetGithub" class="btn-preset btn-preset-github">
          <svg class="preset-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          GitHub Models
          <span class="preset-model">GPT-4o-mini</span>
        </button>
        <button id="presetOpenAI4o" class="btn-preset btn-preset-openai">
          <svg class="preset-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855l-5.833-3.387L15.119 7.2a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667zm2.01-3.023l-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135l-2.02-1.164a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.375-3.453l-.142.08L8.704 5.46a.795.795 0 0 0-.393.681zm1.097-2.365l2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z"/></svg>
          OpenAI
          <span class="preset-model">GPT-4o-mini</span>
        </button>
        <button id="presetOpenAI5" class="btn-preset btn-preset-openai">
          <svg class="preset-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855l-5.833-3.387L15.119 7.2a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667zm2.01-3.023l-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135l-2.02-1.164a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.375-3.453l-.142.08L8.704 5.46a.795.795 0 0 0-.393.681zm1.097-2.365l2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z"/></svg>
          OpenAI
          <span class="preset-model">GPT-5-mini</span>
        </button>
      </div>
      <div class="field">
        <label for="serverName">서버 이름</label>
        <input type="text" id="serverName" placeholder="GPT-4o">
      </div>
      <div class="field">
        <label for="serverEndpoint">Endpoint URL</label>
        <input type="text" id="serverEndpoint" placeholder="https://api.openai.com/v1">
      </div>
      <div class="field">
        <label for="serverModel">Model</label>
        <input type="text" id="serverModel" placeholder="gpt-4o-mini">
      </div>
      <div class="field">
        <label for="serverApiKey">API Key</label>
        <input type="password" id="serverApiKey" placeholder="sk-...">
        <p id="patGuide" class="pat-guide" style="display:none;">
          <a href="#" id="patGuideLink">GitHub PAT 생성하기 (models:read 권한 필요) →</a>
        </p>
      </div>
      <button id="saveServerBtn" class="btn-save">저장</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
